name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, unit tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  integration:
    name: Go (integration, real Docker)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # The "go" target of dev/Dockerfile: no Chromium, fonts or Node.js,
      # which the Go tests do not use and which took most of the image build.
      KOROKU_DEV_TARGET: go
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The Go module and build caches live in a host directory instead of
      # named volumes, so that actions/cache can carry them between runs.
      # (actions/cache refuses paths with "..", and the runner context is
      # not available in job-level env, hence the step.)
      - name: Choose the cache directory
        run: echo "KOROKU_DEV_CACHE=$RUNNER_TEMP/koroku-dev-cache" >> "$GITHUB_ENV"
      - name: Restore the Go caches
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.KOROKU_DEV_CACHE }}
          # The Dockerfile pins the Go version and go.sum the modules. The
          # cache is saved once per key: what it holds is mostly the
          # dependencies, and the project's own packages compile quickly.
          key: integration-go-${{ hashFiles('dev/Dockerfile', 'go.sum') }}
      # The integration tests run inside the development image, the same way
      # as on a developer machine (bin/dev), so they have restic and the
      # Compose version the project is developed against. Like bin/dev, CI
      # rebuilds the image only when dev/Dockerfile changes: loading the
      # saved image is faster than building it.
      - name: Restore the development image
        id: image-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/koroku-dev-image.tar.zst
          key: integration-image-${{ hashFiles('dev/Dockerfile') }}
      - name: Load the development image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: zstd -dc "$RUNNER_TEMP/koroku-dev-image.tar.zst" | docker load
      - name: Build the development image
        run: bin/dev true
      - name: Save the development image
        if: steps.image-cache.outputs.cache-hit != 'true'
        # The tag is the one bin/dev gives the "go" target.
        run: docker save "koroku-dev:$(sha256sum dev/Dockerfile | cut -c1-12)-go" | zstd -T0 -o "$RUNNER_TEMP/koroku-dev-image.tar.zst"
      - name: Tool versions
        run: bin/dev sh -c 'go version && docker version --format "{{.Server.Version}}" && docker compose version && restic version'
      - name: go vet (integration tag)
        run: bin/dev go vet -tags integration ./...
      # -count=1: the restored build cache also holds test results, and an
      # integration test must not pass from cache when only Docker changed.
      - name: go test (integration tag)
        run: bin/dev go test -count=1 -tags integration ./...

  web-lint:
    name: Web (lint)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  web-test:
    name: Web (test)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
