# Sample app with a `build:` section, used by the integration tests.
services:
  web:
    build: .
    environment:
      # Interpolated by Compose. The repository's own .env defines this
      # variable, but koroku passes --env-file, so .env is not consulted.
      FROM_REPO_DOTENV: "${FROM_REPO_DOTENV:-unset}"
    ports:
      - "8080:8080"
    volumes:
      - data:/data
  sidecar:
    image: busybox:1.37
    command: ["sleep", "infinity"]
    stop_signal: SIGKILL
    # Must not be reachable from the host once deployed.
    ports:
      - "5432:5432"

volumes:
  data:
