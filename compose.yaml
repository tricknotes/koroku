# Local development environment (not a way to run koroku in production; see
# docs/OPERATIONS.md for that).
#
#   docker compose up
#
# then open http://localhost:4200. Run it from the repository root.
#
#   web     Vite dev server in development mode, with hot reload of the Ember
#           app. /api and /auth are proxied to koroku.
#   koroku  The control plane, built from this checkout, with login disabled.
#           It deploys apps into the local Docker daemon.
#   caddy   The reverse proxy, on 127.0.0.1:80 and :443 only. koroku loads its
#           configuration as in production, so a deployed app answers on
#           https://<slug>.dev.localhost and the console on
#           https://console.dev.localhost. Certificates come from Caddy's own
#           local CA; import its root certificate into the browser's trust
#           store (see README.md).
#
# After changing Go code: docker compose restart koroku
#
# Both services run in the image of dev/Dockerfile (the same one bin/dev
# uses) and share its caches. Like bin/dev they use the host network and the
# host's Docker socket, and mount the checkout at its host path: the apps
# koroku deploys are started by the host's daemon, which resolves paths on the
# host. State lives in data/dev/ (ignored by git); delete it to start over.

name: koroku-dev

x-dev: &dev
  image: koroku-dev:compose
  build: ./dev
  init: true
  network_mode: host
  working_dir: ${PWD}
  # Drops from root to the owner of the checkout before running the command.
  entrypoint: ["dev/compose-entrypoint.sh"]
  volumes:
    - ${PWD}:${PWD}
    - /var/run/docker.sock:/var/run/docker.sock
    - go:/cache/go
    - go-build:/cache/go-build
    - pnpm:/cache/pnpm-store

services:
  koroku:
    <<: *dev
    command: ["dev/serve.sh"]
    depends_on:
      caddy:
        condition: service_healthy

  caddy:
    image: caddy:2.11.9
    network_mode: host
    # The admin API stays on loopback; --resume brings back the routes koroku
    # loaded last, so restarting Caddy alone does not drop them.
    command: ["caddy", "run", "--resume", "--config", "/etc/caddy/koroku-initial.json"]
    volumes:
      - ./deploy/caddy-initial.json:/etc/caddy/koroku-initial.json:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 2s
      retries: 15

  web:
    <<: *dev
    command:
      - sh
      - -c
      - >-
        cd web &&
        pnpm install --frozen-lockfile &&
        exec pnpm exec vite --mode development --host 127.0.0.1 --port 4200 --strictPort
    environment:
      # Point this at another backend to develop against it, for example the
      # mock API of web/mock/server.mjs.
      KOROKU_URL: ${KOROKU_URL:-http://127.0.0.1:8080}

# The caches bin/dev uses. When bin/dev created them first, Compose warns that
# they were "not created by Docker Compose"; sharing them is intended.
volumes:
  go:
    name: koroku-dev-go
  go-build:
    name: koroku-dev-go-build
  pnpm:
    name: koroku-dev-pnpm
  # Caddy's local CA (its root key and certificate) and the issued
  # certificates. Deleting it makes a new CA, which has to be trusted again.
  caddy-data:
    name: koroku-dev-caddy-data
  caddy-config:
    name: koroku-dev-caddy-config
