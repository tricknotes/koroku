# koroku configuration. Copy to /etc/koroku/config.toml and adjust.
# Values here are placeholders; do not commit real addresses or secrets.

# Apps are served at <slug>.<base_domain>.
base_domain = "dev.example.com"

# Hostname of the management UI. Defaults to console.<base_domain>.
# console_host = "console.dev.example.com"

# koroku listens on loopback only; Caddy terminates TLS in front of it.
listen = "127.0.0.1:8080"

# SQLite database, releases, env files and logs live here.
data_dir = "/var/lib/koroku"

# Public address of this host. Custom domains must resolve to it.
public_ip = "203.0.113.10"

# Key used to encrypt environment variable values (32 random bytes, mode 0600).
master_key_file = "/etc/koroku/master.key"

# Time zone for schedules (daily backup, log archive windows) and log file dates.
timezone = "Asia/Tokyo"

[deploy]
# Memory limit applied to every service unless the app overrides it.
default_memory_limit = "512m"
# New deployments are rejected while the data disk is fuller than this.
disk_usage_limit_percent = 85
# Host ports assigned to apps (bound to 127.0.0.1 only).
port_range_start = 20000
port_range_end = 20999
# Remove dangling images after each successful deploy.
prune_images = true

[caddy]
# koroku generates the whole Caddy configuration from its database and loads
# it through the admin API. Set enabled = false to run without Caddy (local
# development).
enabled = true
admin_url = "http://127.0.0.1:2019"
# While testing the setup, use the Let's Encrypt staging directory to stay
# clear of the production rate limits. Remove the line to get real certificates.
acme_ca = "https://acme-staging-v02.api.letsencrypt.org/directory"
# Optional contact address for the ACME account.
# acme_email = "admin@example.com"
# One access log per app; the caddy user must be able to write here.
access_log_dir = "/var/log/caddy/apps"
# Local development only (see compose.yaml): listen on this address alone
# instead of every interface, and issue certificates from Caddy's own CA
# instead of ACME. Leave both unset on a real host.
# listen_ip = "127.0.0.1"
# internal_ca = true

[github]
# The GitHub App used for login, for fetching repositories and for
# recording deployments on GitHub. Without this section nobody can log in.
# Permissions: Contents (read-only), Metadata (read-only) and Deployments
# (read and write; without it deployments are not shown on GitHub);
# callback URL: https://<console_host>/auth/github/callback.
# app_id = 123456
# client_id = "Iv1.xxxxxxxxxxxxxxxx"
# client_secret = "..."
# private_key_file = "/etc/koroku/github-app.pem"
# Numeric ID of the only GitHub user allowed to log in
# (see https://api.github.com/users/<login>).
# allowed_user_id = 0
# Other accounts (organizations you manage) whose installations of the App
# koroku uses, by login. The App must be installable on any account for this;
# installations on accounts not listed here (or the allowed user's own) are
# ignored.
# installation_accounts = ["my-org"]
# Turn on two-factor authentication for that GitHub account: GitHub asks
# for it when you sign in to the console. koroku cannot check it itself.

[storage]
# S3-compatible object storage for log archives (logs/) and restic backups
# (restic/), reached with path-style URLs (https://<endpoint>/<bucket>/<key>).
# Use the S3 endpoint and region of the provider ("auto" where the provider
# has no regions), a key limited to this bucket, and a lifecycle rule that
# deletes objects under logs/ after 90 days (never under restic/).
# Without this section logs stay local only and backups are disabled.
# endpoint = "https://s3.example.com"
# region = "auto"
# bucket = "koroku"
# access_key_id = "..."
# secret_access_key = "..."

[logs]
# Days of logs kept on local disk.
retention_days = 14
# How often logs are archived to object storage (1-24 hours).
archive_interval_hours = 4

[backup]
# restic repository password (mode 0600). Keep a copy outside this host:
# without it the backups cannot be restored.
restic_password_file = "/etc/koroku/restic.key"
# Hour of the daily backup, in the time zone above.
hour = 3

[tasks]
# One-off commands run from the console stop after this many minutes.
timeout_minutes = 30
