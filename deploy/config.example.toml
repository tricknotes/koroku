# paasd configuration. Copy to /etc/paas/config.toml and adjust.
# Values here are placeholders; do not commit real addresses or secrets.

# Apps are served at <slug>.<base_domain>.
base_domain = "dev.example.com"

# Hostname of the management UI. Defaults to console.<base_domain>.
# console_host = "console.dev.example.com"

# paasd listens on loopback only; Caddy terminates TLS in front of it.
listen = "127.0.0.1:8080"

# SQLite database, releases, env files and logs live here.
data_dir = "/var/lib/paas"

# Public address of this host. Custom domains must resolve to it.
public_ip = "203.0.113.10"

# Key used to encrypt environment variable values (32 random bytes, mode 0600).
master_key_file = "/etc/paas/master.key"

[deploy]
# Memory limit applied to every service unless the app overrides it.
default_memory_limit = "512m"
# New deployments are rejected while the data disk is fuller than this.
disk_usage_limit_percent = 85
# Host ports assigned to apps (bound to 127.0.0.1 only).
port_range_start = 20000
port_range_end = 20999
# Remove dangling images after each successful deploy.
prune_images = true

[caddy]
# paasd generates the whole Caddy configuration from its database and loads
# it through the admin API. Set enabled = false to run without Caddy (local
# development).
enabled = true
admin_url = "http://127.0.0.1:2019"
# While testing the setup, use the Let's Encrypt staging directory to stay
# clear of the production rate limits. Remove the line to get real certificates.
acme_ca = "https://acme-staging-v02.api.letsencrypt.org/directory"
# Optional contact address for the ACME account.
# acme_email = "admin@example.com"
# One access log per app; the caddy user must be able to write here.
access_log_dir = "/var/log/caddy/apps"

[github]
# The GitHub App used for login and for fetching repositories. Without this
# section nobody can log in. Permissions: Contents (read-only) and Metadata
# (read-only); callback URL: https://<console_host>/auth/github/callback.
# app_id = 123456
# client_id = "Iv1.xxxxxxxxxxxxxxxx"
# client_secret = "..."
# private_key_file = "/etc/paas/github-app.pem"
# Numeric ID of the only GitHub user allowed to log in
# (see https://api.github.com/users/<login>).
# allowed_user_id = 0
