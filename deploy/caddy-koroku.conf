# Drop-in for caddy.service, installed by deploy/provision.sh to
# /etc/systemd/system/caddy.service.d/koroku.conf.
#
# koroku owns the whole Caddy configuration: it generates it from its database
# and replaces it through the admin API (POST /load on 127.0.0.1:2019). The
# Caddyfile shipped with the package is therefore not used.

[Service]
# --resume starts Caddy with the configuration it saved after the last
# successful load (autosave.json in the caddy user's config directory), so a
# restart of Caddy or a reboot brings every app route back at once. Without
# it the apps would be unreachable until koroku loads the configuration again
# (it does so every 5 minutes), or for as long as koroku is down. --config is
# only the fallback for the very first start, when nothing has been saved
# yet: it keeps the admin API on loopback and serves nothing.
ExecStart=
ExecStart=/usr/bin/caddy run --environ --resume --config /etc/caddy/koroku-initial.json

# Collect garbage at 50% heap growth instead of Go's default 100%. Caddy's
# heap grows with each burst of requests and TLS handshakes and stays there;
# GOGC=50 keeps around 10 MiB less resident for a little more CPU, which a
# host shared by a few small apps can spare.
Environment=GOGC=50

# The packaged ExecReload loads /etc/caddy/Caddyfile, which would replace the
# routes koroku loaded until its next periodic load. Without a reload command,
# "systemctl reload caddy" fails instead of dropping the routes.
ExecReload=
